<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feliz 21 de Septiembre</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: linear-gradient(135deg, #fff3b0 0%, #cae9ff 100%);
      font-family: 'Poppins', sans-serif, system-ui;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      text-align: center;
      color: #333;
    }

    /* Animación de flores cayendo */
    .petal {
      position: absolute;
      top: -10%;
      user-select: none;
      pointer-events: none;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0.2;
      }
    }

    /* Contenedor Principal */
    .card {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(8px);
      padding: 30px 20px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      max-width: 90%;
      width: 400px;
      z-index: 10;
      animation: fadeIn 1.5s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Ramo de Girasoles en SVG */
    .sunflower-svg {
      width: 200px;
      height: 200px;
      margin: 0 auto;
      filter: drop-shadow(0px 8px 12px rgba(0,0,0,0.15));
      animation: pulse 3s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    h1 {
      color: #d4a373;
      font-size: 1.8rem;
      margin-top: 15px;
      margin-bottom: 10px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
    }

    p {
      color: #555;
      font-size: 1.1rem;
      font-weight: 500;
    }

    /* Botón de Música */
    .music-btn {
      margin-top: 20px;
      padding: 12px 24px;
      background-color: #ffb703;
      color: #fff;
      border: none;
      border-radius: 25px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 183, 3, 0.4);
      transition: all 0.3s ease;
    }

    .music-btn:hover {
      background-color: #fb8500;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <!-- Contenedor del Audio (JVKE - Golden Hour Instrumental) -->
  <audio id="bg-music" loop>
    <source src="https://ia801503.us.archive.org/15/items/jvke-golden-hour-instrumental/JVKE%20-%20golden%20hour%20%28instrumental%29.mp3" type="audio/mpeg">
  </audio>

  <div class="card">
    <!-- SVG Arte de Ramo de Girasoles -->
    <svg class="sunflower-svg" viewBox="0 0 200 200">
      <!-- Tallo y Hojas -->
      <path d="M100,120 Q90,160 100,200" stroke="#4A7C59" stroke-width="8" fill="none"/>
      <path d="M100,160 Q70,150 60,170 Q85,175 100,160" fill="#4A7C59"/>
      <path d="M100,145 Q130,135 140,155 Q115,160 100,145" fill="#4A7C59"/>
      
      <!-- Pétalos -->
      <g fill="#FFC300">
        <ellipse cx="100" cy="50" rx="12" ry="35" />
        <ellipse cx="100" cy="50" rx="12" ry="35" transform="rotate(30 100 100)"/>
        <ellipse cx="100" cy="50" rx="12" ry="35" transform="rotate(60 100 100)"/>
        <ellipse cx="100" cy="50" rx="12" ry="35" transform="rotate(90 100 100)"/>
        <ellipse cx="100" cy="50" rx="12" ry="35" transform="rotate(120 100 100)"/>
        <ellipse cx="100" cy="50" rx="12" ry="35" transform="rotate(150 100 100)"/>
        <ellipse cx="100" cy="50" rx="12" ry="35" transform="rotate(180 100 100)"/>
        <ellipse cx="100" cy="50" rx="12" ry="35" transform="rotate(210 100 100)"/>
        <ellipse cx="100" cy="50" rx="12" ry="35" transform="rotate(240 100 100)"/>
        <ellipse cx="100" cy="50" rx="12" ry="35" transform="rotate(270 100 100)"/>
        <ellipse cx="100" cy="50" rx="12" ry="35" transform="rotate(300 100 100)"/>
        <ellipse cx="100" cy="50" rx="12" ry="35" transform="rotate(330 100 100)"/>
      </g>
      <!-- Centro del Girasol -->
      <circle cx="100" cy="100" r="32" fill="#582F0E"/>
      <circle cx="100" cy="100" r="28" fill="#7F4F24" stroke="#3A1900" stroke-width="2" stroke-dasharray="4"/>
    </svg>

    <h1>¡Feliz 21 de Septiembre Bonita! 🌻</h1>
    <p>Un detalle especial para alegrar tu día.</p>

    <button class="music-btn" onclick="toggleMusic()">🎵 Reproducir Música</button>
  </div>

  <script>
    // Generar animación de flores/pétalos cayendo
    const flowers = ['🌻', '🟡', '✨', '🌼'];
    function createPetal() {
      const petal = document.createElement('div');
      petal.classList.add('petal');
      petal.innerText = flowers[Math.floor(Math.random() * flowers.length)];
      petal.style.left = Math.random() * 100 + 'vw';
      petal.style.animationDuration = Math.random() * 3 + 3 + 's';
      petal.style.fontSize = Math.random() * 15 + 15 + 'px';
      document.body.appendChild(petal);

      setTimeout(() => {
        petal.remove();
      }, 6000);
    }
    setInterval(createPetal, 300);

    // Control de la Música
    const music = document.getElementById('bg-music');
    let isPlaying = false;

    function toggleMusic() {
      const btn = document.querySelector('.music-btn');
      if (!isPlaying) {
        music.play();
        btn.innerText = '⏸️ Pausar Música';
        isPlaying = true;
      } else {
        music.pause();
        btn.innerText = '🎵 Reproducir Música';
        isPlaying = false;
      }
    }
  </script>
</body>
</html>
