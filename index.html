<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feliz 21 de Septiembre</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: linear-gradient(135deg, #fff3b0 0%, #cae9ff 100%);
      font-family: 'Poppins', sans-serif, system-ui;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      text-align: center;
      color: #333;
    }

    /* Pantalla de inicio para activar música */
    #welcome-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(135deg, #ffe5ec 0%, #ffc6ff 100%);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    #welcome-screen.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .start-btn {
      padding: 16px 32px;
      background-color: #ffb703;
      color: #fff;
      border: none;
      border-radius: 50px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(255, 183, 3, 0.5);
      animation: pulse 1.8s infinite ease-in-out;
      transition: transform 0.2s ease;
    }

    .start-btn:active {
      transform: scale(0.95);
    }

    /* Animación de flores cayendo */
    .petal {
      position: absolute;
      top: -10%;
      user-select: none;
      pointer-events: none;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0.2;
      }
    }

    /* Contenedor Principal */
    .card {
      background: rgba(255, 255, 255, 0.85);
    .music-btn {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #ffb703;
      color: #fff;
      border: none;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(255, 183, 3, 0.3);
    }
  </style>
</head>
<body>

  <!-- Pantalla de bienvenida interactiva -->
  <div id="welcome-screen">
    <h2 style="margin-bottom: 25px; color: #6b705c; font-size: 1.5rem;">Tenes un mensaje especial ✉️</h2>
    <button class="start-btn" onclick="startExperience()">🌻 Toca aquí para ver 🌻</button>
  </div>

  <!-- Audio -->
  <audio id="bg-music" loop preload="auto">
    <source src="musica.mp3" type="audio/mpeg">
  </audio>

  <!-- Contenido principal -->
  <div class="card">
    <svg class="sunflower-svg" viewBox="0 0 200 200">
      <path d="M100,120 Q90,160 100,200" stroke="#4A7C59" stroke-width="8" fill="none"/>
      <path d="M100,160 Q70,150 60,170 Q85,175 100,160" fill="#4A7C59"/>
      <path d="M100,145 Q130,135 140,155 Q115,160 100,145" fill="#4A7C59"/>
      
      <g fill="#FFC300">
        <ellipse cx="100" cy="50" rx="12" ry="35" />
        <ellipse cx="100" cy="50" rx="12" ry="35" transform="rotate(30 100 100)"/>
        <ellipse cx="100" cy="50" rx="12" ry="35" transform="rotate(60 100 100)"/>
        <ellipse cx="100" cy="50" rx="12" ry="35" transform="rotate(90 100 100)"/>
        <ellipse cx="100" cy="50" rx="12" ry="35" transform="rotate(120 100 100)"/>
        <ellipse cx="100" cy="50" rx="12" ry="35" transform="rotate(150 100 100)"/>
        <ellipse cx="100" cy="50" rx="12" ry="35" transform="rotate(180 100 100)"/>
        <ellipse cx="100" cy="50" rx="12" ry="35" transform="rotate(210 100 100)"/>
        <ellipse cx="100" cy="50" rx="12" ry="35" transform="rotate(240 100 100)"/>
        <ellipse cx="100" cy="50" rx="12" ry="35" transform="rotate(270 100 100)"/>
        <ellipse cx="100" cy="50" rx="12" ry="35" transform="rotate(300 100 100)"/>
        <ellipse cx="100" cy="50" rx="12" ry="35" transform="rotate(330 100 100)"/>
      </g>
      <circle cx="100" cy="100" r="32" fill="#582F0E"/>
      <circle cx="100" cy="100" r="28" fill="#7F4F24" stroke="#3A1900" stroke-width="2" stroke-dasharray="4"/>
    </svg>

    <h1>¡Feliz 21 de Septiembre Bonita! 🌻</h1>
    <p>Un detalle especial para alegrar tu día.</p>

    <button class="music-btn" id="toggle-btn" onclick="toggleMusic()">⏸️ Pausar Música</button>
  </div>

  <script>
    const music = document.getElementById('bg-music');
    let isPlaying = false;

    function startExperience() {
      // Ocultar pantalla de bienvenida
      document.getElementById('welcome-screen').classList.add('hidden');
      
      // Reproducir música inmediatamente
      music.play().then(() => {
        isPlaying = true;
      }).catch(err => {
        console.log("Error al reproducir audio:", err);
      });

      // Iniciar lluvia de flores
      setInterval(createPetal, 300);
    }

    const flowers = ['🌻', '🟡', '✨', '🌼'];
    function createPetal() {
      const petal = document.createElement('div');
      petal.classList.add('petal');
      petal.innerText = flowers[Math.floor(Math.random() * flowers.length)];
      petal.style.left = Math.random() * 100 + 'vw';
      petal.style.animationDuration = Math.random() * 3 + 3 + 's';
      petal.style.fontSize = Math.random() * 15 + 15 + 'px';
      document.body.appendChild(petal);

      setTimeout(() => {
        petal.remove();
      }, 6000);
    }

    function toggleMusic() {
      const btn = document.getElementById('toggle-btn');
      if (isPlaying) {
        music.pause();
        btn.innerText = '🎵 Reproducir Música';
        isPlaying = false;
      } else {
        music.play();
        btn.innerText = '⏸️ Pausar Música';
        isPlaying = true;
      }
    }
  </script>
</body>
</html>
